<!DOCTYPE html>

    <meta charset="UTF-8" />

    <a></a>
    <link rel="stylesheet" href="public/styles.css" type="text/css" />
    <title>Share Plate</title>

    <header>
      <div class="logo-container">
        <!-----------------------------logo goes here ------------------------------------------>
        <img
          src="public/images/transparentlogo.svg"
          alt="Animation of plate with share plate in the middle"
        />

        <!-- Start of Navbar -->

    <div class="create-form">
      <form>

        <label for="recipe">Recipe</label>

        <label for="image">Image</label>

        <!-- SHOPPING LIST -->
        <div class="shopping-list">
          <label for="items">Shopping List</label>
          <input type="text" />
          <label for="items-price">Price</label>
          <input type="number" />
        </div>
        <!-- INSYRUCTIONS -->
        <label for="">Instructions</label>
        <input type="text" />
        <!-- FILTERS -->
         <label for="diet">Diet</label>

      </form>
