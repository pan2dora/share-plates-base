  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="public/styles.css" type="text/css" />
    <title>Share Plate</title>
  </head>
    <!-- Header & Primary Nav container -->
    <div class="nav-wrapper">
      <header>
        <!--  Hambuger -->
        <i class="fa-solid fa-bars"></i>
        <!-----------------------------Logo ------------------------------------------>
        <img
          src="public/images/Share.svg"
          alt="Animation of plate with share plate in the middle"
          class="nav-logo"
        />
        <!-- Start of Primary Navbar -->

        <nav class="primary-navigation">
          <!-----------------------------Navbar Links------------------------------------------>
          <ul class="nav-links">
            <li><a href="discover.html">Discover</a></li>
            <li><a href="about.html">About</a></li>
          </ul>
        </nav>

        <!-----------------------------Search ------------------------------------------>

        <div class="search">
          <input type="text" class="search-bar" placeholder="Search..." />
          <!-- Search Icon -->
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <!-- Profile Icon - This will eventually become a drop down-->
        <div>
          <i class="fa-solid fa-circle-user"></i>
        </div>
      </header>
    </div>
    <!----------------------------Content---------------------------------------->
    <div class="form-wrapper">
      <form class="create-form">
        <!-- RECIPE NAME -->
         <div class="flex-input">
        <label for="recipe">Recipe</label>
        <input type="text" />
      </div>
        <!-- IMAGE UPLOAD -->
         <div class="flex-input">
        <label for="image">Image</label>
        <input type="file" />
      </div>
        <!-- BLERB -->
         <div class="flex-input">
        <label for="about">About Recipe</label>
        <input type="text" />
        </div>
        <!-- SHOPPING LIST -->
        <div class="flex-input">
          
          <label for="items">Shopping List</label>
          <input type="text" />
          
        </div>
        <div class="flex-input">
          <label for="items-price">Price</label>
          <input type="number" />
        </div>
        <!-- INSYRUCTIONS -->
         <div class="flex-input">
        <label for="">Instructions</label>
        <input type="text" />
      </div>
        <!-- FILTERS -->
         <div class="flex-input">
         <label for="diet">Diet</label>
         <input type="">
         </div>
         <!-- Eventually this will be where people can input various dietary tags -->
        <!-- SUBMIT BUTTON -->
 
          <input type="button" value="Update" onclick="window.location.href='discover.html'"> 
      
      </form>
    </div>

 <!-- PRODUCT OF/BRANDING ICON -->
